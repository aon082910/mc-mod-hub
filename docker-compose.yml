version: "3.8"

services:
  mc-mod-hub:
    build: .
    container_name: mc-mod-hub
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # Optional — only needed for the "Install to my server" / update-checker
      # feature (off by default, toggled in admin config). Point this at your
      # Minecraft server's actual mods folder.
      # - ./mods:/mods
    environment:
      # SESSION_SECRET is optional — omit it and the app generates and
      # persists a random one on first boot. Set it explicitly only if you
      # want to fix it yourself (e.g. sharing a secret across instances).
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
