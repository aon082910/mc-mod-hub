version: "3.8"

services:
  mc-mod-hub:
    build: .
    container_name: mc-mod-hub
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # SESSION_SECRET is optional — omit it and the app generates and
      # persists a random one on first boot. Set it explicitly only if you
      # want to fix it yourself (e.g. sharing a secret across instances).
      - ADMIN_PASSWORD=admin
    restart: unless-stopped
